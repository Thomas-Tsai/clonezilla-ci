# Configuration file for cloud image downloads / image inventory.
#
# Columns (whitespace separated):
#   OS RELEASE ARCH [FIRMWARE] URL [SHA256]
#
# - OS/RELEASE/ARCH/FIRMWARE define the local filename:
#     <OS>-<RELEASE>[-<FIRMWARE>]-<ARCH>.qcow2
# - FIRMWARE (bios|uefi) is set only when the image is firmware-specific
#   (e.g. ubuntu-zfs, windows). Generic dual-boot cloud images omit it.
# - URL: a direct https:// download URL, or a non-http hint such as
#   PLACEHOLDER_* / MANUAL_* for images that must be built or prepared
#   locally (download_cloud_images.sh skips those entries).
# - SHA256: optional checksum verified after download ("-" or omitted = skip).
#
# Consumers: download_cloud_images.sh, sync_images.sh, jobs/common.sh
# (image_name_from_conf_line), jobs/test_os_*.sh.
#
