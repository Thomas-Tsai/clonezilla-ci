# This is the parent pipeline. It supports both scheduled and manual triggers.

default:
  timeout: 90m
  retry: 1

stages:
  - trigger

# This job runs automatically for scheduled pipelines.
# It uses the variables (ARCH, TYPE) defined in the schedule UI.
trigger:scheduled:
  stage: trigger
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  variables:
    # Forward the schedule source to the child pipeline, since child pipelines
    # report CI_PIPELINE_SOURCE=parent_pipeline (not "schedule").
    PARENT_PIPELINE_SOURCE: "schedule"
  trigger:
    include: 'child-pipeline.yml'
    strategy: depend
    forward:
      pipeline_variables: true

# This template is for the manual trigger jobs below.
.trigger_template: &trigger_template
  stage: trigger
  rules:
    - when: manual
  trigger:
    include: 'child-pipeline.yml'
    strategy: depend
    forward:
      pipeline_variables: true

# --- AMD64 Triggers ---

trigger:amd64-stable:
  <<: *trigger_template
  variables:
    ARCH: 'amd64'
    TYPE: 'stable'

trigger:amd64-testing:
  <<: *trigger_template
  variables:
    ARCH: 'amd64'
    TYPE: 'testing'

trigger:amd64-alternative-stable:
  <<: *trigger_template
  variables:
    ARCH: 'amd64'
    TYPE: 'alternative-stable'

trigger:amd64-alternative-testing:
  <<: *trigger_template
  variables:
    ARCH: 'amd64'
    TYPE: 'alternative-testing'

# --- ARM64 Triggers ---

trigger:arm64:
  <<: *trigger_template
  variables:
    ARCH: 'arm64'
    TYPE: 'experimental'

# --- RISCV64 Triggers ---

trigger:riscv64:
  <<: *trigger_template
  variables:
    ARCH: 'riscv64'
    TYPE: 'experimental'

# --- Test on specific runner (e.g. new VM) -------------------------------
# These manual trigger jobs pass RUNNER_TAG to the child pipeline so that
# all test jobs run on the specified runner tag instead of the default
# "clonezilla" tag.  Useful for testing new runners without affecting
# scheduled pipelines.
#
# Currently targets "new-vm" (ubuntu-2404-vm-runner, ID 55772072).
# Note: update_sif (needs build_sif tag) and test:os:windows11 (needs
# windows tag) are NOT affected — they keep their dedicated tags and will
# NOT run on the new VM.

.trigger_template_new_vm: &trigger_template_new_vm
  stage: trigger
  rules:
    - when: manual
  trigger:
    include: 'child-pipeline.yml'
    strategy: depend
    forward:
      pipeline_variables: true

# --- AMD64 (new-vm) ---

trigger:amd64-stable-new-vm:
  <<: *trigger_template_new_vm
  variables:
    ARCH: 'amd64'
    TYPE: 'stable'
    RUNNER_TAG: 'new-vm'

trigger:amd64-testing-new-vm:
  <<: *trigger_template_new_vm
  variables:
    ARCH: 'amd64'
    TYPE: 'testing'
    RUNNER_TAG: 'new-vm'

trigger:amd64-alternative-stable-new-vm:
  <<: *trigger_template_new_vm
  variables:
    ARCH: 'amd64'
    TYPE: 'alternative-stable'
    RUNNER_TAG: 'new-vm'

trigger:amd64-alternative-testing-new-vm:
  <<: *trigger_template_new_vm
  variables:
    ARCH: 'amd64'
    TYPE: 'alternative-testing'
    RUNNER_TAG: 'new-vm'

# Add more combinations as needed.
