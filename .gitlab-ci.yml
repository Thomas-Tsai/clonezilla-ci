# This is the parent pipeline. It supports both scheduled and manual triggers.

default:
  timeout: 90m
  retry: 1

stages:
  - trigger

# This job runs automatically for scheduled pipelines.
# It uses the variables (ARCH, TYPE) defined in the schedule UI.
# Excluded for the dedicated "update-sif" schedule (SIF_UPDATE_ONLY=true),
# which should only run f1_probe + update_sif below.
trigger:scheduled:
  stage: trigger
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SIF_UPDATE_ONLY != "true"'
  variables:
    # Forward the schedule source to the child pipeline, since child pipelines
    # report CI_PIPELINE_SOURCE=parent_pipeline (not "schedule").
    PARENT_PIPELINE_SOURCE: "schedule"
  trigger:
    include: 'child-pipeline.yml'
    strategy: depend
    forward:
      pipeline_variables: true

# This template is for the manual trigger jobs below.
# These jobs only exist on push/web/api/trigger pipelines. On scheduled
# pipelines they are excluded so the pipeline ends in a real final status
# (success/failed) instead of lingering in "manual" state forever — thousands
# of such zombie pipelines accumulated previously and confused status
# recalculation during cleanup.
.trigger_template: &trigger_template
  stage: trigger
  rules:
    # SIF_UPDATE_ONLY pipelines (fired by build_singularity after an image
    # rebuild) must not grow these manual trigger jobs as zombies.
    - if: '($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "trigger") && $SIF_UPDATE_ONLY != "true"'
      when: manual
  trigger:
    include: 'child-pipeline.yml'
    strategy: depend
    forward:
      pipeline_variables: true

# --- AMD64 Triggers ---

trigger:amd64-stable:
  <<: *trigger_template
  variables:
    ARCH: 'amd64'
    TYPE: 'stable'

trigger:amd64-testing:
  <<: *trigger_template
  variables:
    ARCH: 'amd64'
    TYPE: 'testing'

trigger:amd64-unstable:
  <<: *trigger_template
  variables:
    ARCH: 'amd64'
    TYPE: 'unstable'

trigger:amd64-alternative-stable:
  <<: *trigger_template
  variables:
    ARCH: 'amd64'
    TYPE: 'alternative-stable'

trigger:amd64-alternative-testing:
  <<: *trigger_template
  variables:
    ARCH: 'amd64'
    TYPE: 'alternative-testing'

# Codename-scoped alternative-testing track (Ubuntu-based builds). The plain
# alternative-testing track only picks the highest-sorting codename directory
# on the mirror (e.g. tenacious > stonking), silently skipping same-date
# builds of other codenames. Run a dedicated track per codename you care
# about; the type format is alternative-testing-<codename>.
trigger:amd64-alternative-testing-stonking:
  <<: *trigger_template
  variables:
    ARCH: 'amd64'
    TYPE: 'alternative-testing-stonking'

# --- ARM64 Triggers ---

trigger:arm64:
  <<: *trigger_template
  variables:
    ARCH: 'arm64'
    TYPE: 'experimental'

# --- RISCV64 Triggers ---

trigger:riscv64:
  <<: *trigger_template
  variables:
    ARCH: 'riscv64'
    TYPE: 'experimental'

# Add more combinations as needed.
#
# Note: to route a manual run to a specific runner, press "Run pipeline"
# (web) and set the RUNNER_TAG variable (see child-pipeline.yml) instead of
# defining dedicated trigger jobs here.

# --- Dedicated SIF update pipelines -----------------------------------------
# The SIF file for the F1 Slurm environment is refreshed by SIF_UPDATE_ONLY
# pipelines, fully decoupled from the test pipelines above:
#   1. daily "update-sif" schedule (skip-if-unchanged: no-op when the SIF
#      exists and the image was not just rebuilt),
#   2. event-driven trigger fired by build_singularity right after a Docker
#      image rebuild (IMAGE_JUST_BUILT=true forces the SIF rebuild).
# update_sif can only run on the F1 login node (tag: build_sif); when F1 is
# offline that job would stay pending forever and block the pipeline.
# f1_probe runs on a healthy runner first: if F1 is unreachable it fails
# fast, so GitLab skips update_sif (needs unsatisfied) instead of leaving
# it pending.
f1_probe:
  stage: trigger
  tags:
    - clonezilla
  rules:
    - if: '$SIF_UPDATE_ONLY == "true" && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api")'
  script:
    - |
      if timeout 5 bash -c '</dev/tcp/f1-ilgn01.nchc.org.tw/22' 2>/dev/null; then
        echo "F1 login node (f1-ilgn01) is reachable."
      else
        echo "F1 login node (f1-ilgn01) is unreachable. Skipping SIF update."
        exit 1
      fi

update_sif:
  stage: trigger
  tags:
    - build_sif  # 指定專屬 Tag，確保在正確的 Login Node 執行
  rules:
    - if: '$SIF_UPDATE_ONLY == "true" && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api")'
  needs:
    - f1_probe
  # SIF 更新依賴唯一的 self-hosted runner (NCHC F1 X86-64)，
  # 失敗時只影響這條獨立排程 pipeline，不影響主測試 pipelines。
  allow_failure: true
  timeout: 60m
  script:
    - |
      echo "Starting SIF build from Docker Registry..."
      export SINGULARITY_DOCKER_USERNAME="${CI_REGISTRY_USER}"
      export SINGULARITY_DOCKER_PASSWORD="${CI_REGISTRY_PASSWORD}"

      # 定義 SIF 存放路徑
      DEST_DIR="/home/u1597171/clonezilla-ci/slurm"
      if [ ! -d "$DEST_DIR" ]; then
        echo "Warning: Global directory $DEST_DIR not found, using local project directory."
        DEST_DIR="$(pwd)/slurm"
        mkdir -p "$DEST_DIR"
      fi

      SIF_PATH="${DEST_DIR}/clonezilla-ci.sif"
      echo "Target SIF: ${SIF_PATH}"

      # Skip-if-unchanged: the Docker image only changes when build_singularity
      # rebuilds it (which triggers this pipeline with IMAGE_JUST_BUILT=true).
      # Daily schedule runs without that flag are no-ops once the SIF exists,
      # avoiding needlessly rewriting a 399MB file every day.
      # Set FORCE_SIF_REBUILD=true to override (e.g. manual recovery).
      if [ -f "${SIF_PATH}" ] && [ "${IMAGE_JUST_BUILT:-}" != "true" ] && [ -z "${FORCE_SIF_REBUILD:-}" ]; then
        echo "SIF already exists and image unchanged (IMAGE_JUST_BUILT!=true). Skipping. Use FORCE_SIF_REBUILD=true to force."
        exit 0
      fi

      # 使用 -F 強制覆蓋舊檔，確保後續 Slurm 測試使用最新環境
      singularity build -F "${SIF_PATH}" docker://${CI_REGISTRY_IMAGE}:latest

      echo "Success: Updated SIF at ${SIF_PATH}"

# --- Central cloud image repo jobs ------------------------------------------
# The canonical cloud image store lives on the image repo server
# (cicd@140.110.240.58:3322:/home/cicd/clonezilla-cicd-cloudimages; see
# usage.md "qemu/cloudimages/ – 雲端映像庫與中央 repo"). The ASUS PN42 runner
# (tags: clonezilla, windows) is the producer: it downloads/builds images and
# pushes them with qemu/cloudimages/sync_images.sh. Test runners pull missing
# images in their before_script (child-pipeline.yml, gate: IMAGE_PULL).

# images:sync downloads missing config-referenced cloud images onto PN42's
# /data/cloudimages and pushes them to the repo (rsync is incremental; the
# remote MANIFEST.sha256 is rebuilt afterwards).
# Schedules (create in GitLab > CI/CD > Schedules):
#   - daily  "image-sync":        IMAGE_SYNC=true  (fetch newly added config images)
#   - weekly "image-sync-force":  IMAGE_SYNC=true + IMAGE_SYNC_FORCE=true
#     (re-download the moving-target daily images to refresh stale copies)
images:sync:
  stage: trigger
  tags:
    - clonezilla
    - windows # ASUS PN42: the image producer (owns /data/cloudimages)
  rules:
    - if: '$IMAGE_SYNC == "true"'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "trigger"'
      when: manual
    - when: never
  timeout: 180m
  script:
    - cd qemu/cloudimages
    - export CLOUD_IMAGES_DIR=/data/cloudimages
    - ./download_cloud_images.sh --check
    - |
      # PLACEHOLDER/MANUAL entries are skipped by the script. Download
      # failures only warn: the push below still uploads whatever exists.
      if [ "$IMAGE_SYNC_FORCE" = "true" ]; then
        echo "IMAGE_SYNC_FORCE=true: re-downloading all downloadable images."
        ./download_cloud_images.sh --force || echo "WARNING: some downloads failed (see above)."
      else
        ./download_cloud_images.sh || echo "WARNING: some downloads failed (see above)."
      fi
    - ./sync_images.sh --push --yes

# images:build:zfs rebuilds the Ubuntu ZFS-on-root golden images (UEFI+BIOS)
# into /data/cloudimages and pushes them. Manual only for now (long build);
# validate the flow, then consider a weekly schedule.
# allow_failure: while this flow matures it must not poison pipeline status.
images:build:zfs:
  stage: trigger
  tags:
    - clonezilla
    - windows # ASUS PN42
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "trigger"'
      when: manual
    - when: never
  allow_failure: true
  timeout: 180m
  script:
    - ./build-ubuntu-zfs-image.sh --firmware both --output /data/cloudimages
    - cd qemu/cloudimages
    - CLOUD_IMAGES_DIR=/data/cloudimages ./sync_images.sh --push --yes

