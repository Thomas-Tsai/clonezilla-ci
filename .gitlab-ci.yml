# This is the parent pipeline. It supports both scheduled and manual triggers.

default:
  timeout: 90m
  retry: 1

stages:
  - trigger

# This job runs automatically for scheduled pipelines.
# It uses the variables (ARCH, TYPE) defined in the schedule UI.
trigger:scheduled:
  stage: trigger
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  variables:
    # Forward the schedule source to the child pipeline, since child pipelines
    # report CI_PIPELINE_SOURCE=parent_pipeline (not "schedule").
    PARENT_PIPELINE_SOURCE: "schedule"
  trigger:
    include: 'child-pipeline.yml'
    strategy: depend
    forward:
      pipeline_variables: true

# This template is for the manual trigger jobs below.
# These jobs only exist on push/web/api/trigger pipelines. On scheduled
# pipelines they are excluded so the pipeline ends in a real final status
# (success/failed) instead of lingering in "manual" state forever — thousands
# of such zombie pipelines accumulated previously and confused status
# recalculation during cleanup.
.trigger_template: &trigger_template
  stage: trigger
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "trigger"'
      when: manual
  trigger:
    include: 'child-pipeline.yml'
    strategy: depend
    forward:
      pipeline_variables: true

# --- AMD64 Triggers ---

trigger:amd64-stable:
  <<: *trigger_template
  variables:
    ARCH: 'amd64'
    TYPE: 'stable'

trigger:amd64-testing:
  <<: *trigger_template
  variables:
    ARCH: 'amd64'
    TYPE: 'testing'

trigger:amd64-unstable:
  <<: *trigger_template
  variables:
    ARCH: 'amd64'
    TYPE: 'unstable'

trigger:amd64-alternative-stable:
  <<: *trigger_template
  variables:
    ARCH: 'amd64'
    TYPE: 'alternative-stable'

trigger:amd64-alternative-testing:
  <<: *trigger_template
  variables:
    ARCH: 'amd64'
    TYPE: 'alternative-testing'

# --- ARM64 Triggers ---

trigger:arm64:
  <<: *trigger_template
  variables:
    ARCH: 'arm64'
    TYPE: 'experimental'

# --- RISCV64 Triggers ---

trigger:riscv64:
  <<: *trigger_template
  variables:
    ARCH: 'riscv64'
    TYPE: 'experimental'

# Add more combinations as needed.
#
# Note: to route a manual run to a specific runner, press "Run pipeline"
# (web) and set the RUNNER_TAG variable (see child-pipeline.yml) instead of
# defining dedicated trigger jobs here.
