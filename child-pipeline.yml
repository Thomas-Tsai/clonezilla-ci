# This is a child pipeline configuration.
# It expects ARCH and TYPE to be passed as variables from the parent pipeline.
#
# Version-gated scheduled runs:
#   When triggered by a schedule, the first job (check_version) compares the
#   latest Clonezilla version on the NCHC mirror against reports.json on the
#   test-reports branch.
#   - If the version was already tested, downstream test jobs are skipped and
#     the pipeline exits cleanly (no wasted runner time).
#   - If a new version is detected, check_version immediately records a claim
#     in in-progress.json on the test-reports branch (12h TTL) and the full
#     test suite runs against the new zip. Later schedules seeing a fresh
#     claim for the same version get VERSION_STATUS=in_progress and skip, so
#     only one pipeline tests a given version at a time (claims are cleared
#     by publish_reports; canceled pipelines expire via the TTL).
#   - If the mirror currently offers no testable version at all for an
#     arch/type (e.g. the testing tree is emptied right after a testing ->
#     stable promotion), check_version emits VERSION_STATUS=mirror_empty and
#     downstream jobs skip; this is a normal state, not a failure.
#   Manual triggers always run the full suite regardless of version state.

stages:
  - check
  - download
  - test
  - deploy

default:
  timeout: 120m
  retry: 1
  # Note: no global tags here. Each job specifies its own tags.
  # - check_version, download_zip, .test_template: use $RUNNER_TAG
  #   (default "clonezilla", override per-run when starting a manual pipeline)
  # - build_singularity: tag "build"
  # - update_sif: tag "build_sif"
  # - test:os:windows11: tags "clonezilla, windows" (always uses clonezilla,
  #   not affected by RUNNER_TAG, since it needs the physical asus pn42)

variables:
  # ARCH and TYPE are provided by the parent pipeline.
  # CLONEZILLA_ZIP_URL can be provided to specify a direct download URL.
  ARCH: "amd64"
  TYPE: "testing"
  CLONEZILLA_ZIP_URL: ""
  ZIP_DIR: "zip"
  CURL_OPTS: "-fsSL"
  # VERSION_STATUS is set by check_version job's dotenv artifact.
  VERSION_STATUS: ""
  # RUNNER_TAG controls which runner tag the test jobs use.
  # - Default: "clonezilla" (matches all self-hosted clonezilla runners)
  # - Override when starting a manual pipeline (Run pipeline → variables) to
  #   route all test jobs to a different runner, e.g. for testing new runners.
  # Note: update_sif (tag: build_sif) and test:os:windows11 (tag: windows)
  # are NOT affected by this variable — they keep their dedicated tags.
  RUNNER_TAG: "clonezilla"
  # TEST_TIMEOUT_SECONDS bounds a single test job's runtime at script level.
  # Without it, a hung QEMU guest (e.g. an interactive upstream prompt that
  # ignores batch mode) is only stopped by the CI job timeout, which kills
  # the job before logs/ and results/ artifacts can be uploaded — leaving
  # no evidence for debugging and skipping report publishing.
  # Sizing: no KVM is available on F1 Slurm nodes or the VM runner, so all
  # guests run under TCG software emulation. A healthy TCG fs test takes
  # ~12-28 min, but measured 2026-10-23 under pipeline-storm node
  # contention the same test took >90 min for a single step (7x slowdown).
  # 10800s (3h) covers the contended worst case while staying 1h below the
  # 4h job timeout so before_script/after_script/artifact upload still fit.
  TEST_TIMEOUT_SECONDS: "10800"

# --- Version check (scheduled runs only) -----------------------------------
# Compares NCHC mirror vs reports.json on the test-reports branch.
# Emits a dotenv artifact with VERSION_STATUS and LATEST_URL for downstream jobs.
# Reuses the existing reports.json infrastructure (updated by the pages job);
# no separate state file or token is needed.
#
# Note: child pipelines report CI_PIPELINE_SOURCE=parent_pipeline, not
# "schedule". The parent pipeline forwards PARENT_PIPELINE_SOURCE=schedule
# via trigger variables so we can detect scheduled runs here.
check_version:
  stage: check
  tags:
    - "$RUNNER_TAG"
  rules:
    # Only run version gate on scheduled pipelines.
    # Manual/branch pipelines skip this and always run tests.
    - if: '$PARENT_PIPELINE_SOURCE == "schedule"'
      when: on_success
    - when: never
  before_script:
    - chmod +x scripts/check-version-update.sh download-clonezilla.sh scripts/notify-telegram.sh
  script:
    - ./scripts/check-version-update.sh --arch "$ARCH" --type "$TYPE" | tee version_check.env
    - echo "--- version_check.env ---"
    - cat version_check.env
    # Immediately notify the Telegram group when a new version was detected.
    # The script itself gates on VERSION_STATUS=new_version and never fails.
    - set -a; source version_check.env; set +a
    - ./scripts/notify-telegram.sh started
  artifacts:
    name: "version-check-${ARCH}-${TYPE}"
    reports:
      dotenv: version_check.env
    expire_in: 1 day
  # Note: previously had allow_failure: true here, but that caused a GitLab
  # pipeline status calculation bug where the child pipeline was marked as
  # "failed" even when all 22 jobs succeeded. The script itself handles
  # errors with proper exit codes (0=success, 1=fetch error, 2=api error),
  # and downstream jobs use optional: true on the needs dependency, so a
  # hard failure here is safe and won't block the pipeline.

download_zip:
  stage: download
  tags:
    - "$RUNNER_TAG"
  needs:
    # On scheduled runs, depend on check_version for the VERSION_STATUS dotenv.
    # On manual runs, check_version is skipped so this need is optional.
    - job: check_version
      optional: true
      artifacts: true
  allow_failure: false
  script:
    - |
      # Version gate: on scheduled runs with no version change (or a version
      # already claimed by another in-flight pipeline, or a mirror currently
      # offering no testable version), skip the download.
      # (dotenv artifact variables like VERSION_STATUS are not available in
      # rules:if, so we check at script runtime instead.)
      if [ "${PARENT_PIPELINE_SOURCE}" = "schedule" ] && { [ "${VERSION_STATUS}" = "no_change" ] || [ "${VERSION_STATUS}" = "in_progress" ] || [ "${VERSION_STATUS}" = "mirror_empty" ]; }; then
        echo "VERSION_STATUS=${VERSION_STATUS}: skipping download. No new Clonezilla version to test."
        # Still emit the dotenv artifact so downstream jobs can read the skip signal.
        echo "ZIP_FILE_FROM_BUILD=" > build.env
        echo "VERSION_STATUS=${VERSION_STATUS}" >> build.env
        exit 0
      fi
    - mkdir -p "${ZIP_DIR}"
    - chmod +x download-clonezilla.sh
    - |
      LATEST_ZIP=""
      # Priority 1: Direct URL from CI/CD variable
      if [ -n "${CLONEZILLA_ZIP_URL}" ]; then
        echo "INFO: Using provided CLONEZILLA_ZIP_URL: ${CLONEZILLA_ZIP_URL}"
        LATEST_ZIP=$(basename "${CLONEZILLA_ZIP_URL}")
        DEST_FILE="${ZIP_DIR}/${LATEST_ZIP}"
        echo "Downloading ${CLONEZILLA_ZIP_URL} to ${DEST_FILE}..."
        curl ${CURL_OPTS} -o "${DEST_FILE}" "${CLONEZILLA_ZIP_URL}"
        if [ $? -ne 0 ]; then
            echo "ERROR: Download from CLONEZILLA_ZIP_URL failed." >&2
            exit 1
        fi
      # Priority 2: Use the download script with ARCH and TYPE
      else
        echo "INFO: CLONEZILLA_ZIP_URL not set. Using download-clonezilla.sh with ARCH=${ARCH} and TYPE=${TYPE}."
        # The download script outputs the full path of the downloaded file
        DOWNLOADED_ZIP_PATH=$(./download-clonezilla.sh --arch "$ARCH" --type "$TYPE" -o "$ZIP_DIR")
        if [ $? -ne 0 ] || [ -z "$DOWNLOADED_ZIP_PATH" ] || [ ! -f "$DOWNLOADED_ZIP_PATH" ]; then
            echo "ERROR: Failed to auto-download Clonezilla zip using download-clonezilla.sh." >&2
            exit 1
        fi
        LATEST_ZIP=$(basename "$DOWNLOADED_ZIP_PATH")
      fi
    - |
      echo "Final ZIP file to be used: ${LATEST_ZIP}"
      # Save the exact filename to a dotenv artifact to pass to the next stage
      echo "Saving ZIP_FILE_FROM_BUILD=${LATEST_ZIP} to build.env"
      echo "ZIP_FILE_FROM_BUILD=${LATEST_ZIP}" > build.env
  artifacts:
    name: "clonezilla-live-zip-${ARCH}"
    paths:
      - "${ZIP_DIR}/"
    expire_in: 14 day
    reports:
      dotenv: build.env

build_singularity:
  stage: download
  tags:
    - build
  needs:
    - job: check_version
      optional: true
      artifacts: true
  script:
    - |
      # Version gate: skip image rebuild on scheduled no-change / in-progress runs.
      if [ "${PARENT_PIPELINE_SOURCE}" = "schedule" ] && { [ "${VERSION_STATUS}" = "no_change" ] || [ "${VERSION_STATUS}" = "in_progress" ] || [ "${VERSION_STATUS}" = "mirror_empty" ]; }; then
        echo "VERSION_STATUS=${VERSION_STATUS}: skipping Docker image rebuild."
        exit 0
      fi
      echo "Logging into GitLab Container Registry..."
      docker login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"

      echo "Building Docker image..."
      docker build -t "${CI_REGISTRY_IMAGE}:latest" .

      echo "Pushing image to GitLab Container Registry..."
      docker push "${CI_REGISTRY_IMAGE}:latest"
      echo "Docker image pushed to ${CI_REGISTRY_IMAGE}:latest"

# 專門在具備 Singularity 的 Login Node 更新 SIF 檔案
update_sif:
  stage: download
  tags:
    - build_sif  # 指定專屬 Tag，確保在正確的 Login Node 執行
  # SIF 更新依賴唯一的 self-hosted runner (NCHC F1 X86-64)，
  # 離線時不應阻斷整個 pipeline。SIF 不影響測試結果，僅供 Slurm 環境使用。
  allow_failure: true
  needs:
    - build_singularity
    - job: check_version
      optional: true
      artifacts: true
  script:
    - |
      # Version gate: skip SIF rebuild on scheduled no-change / in-progress runs.
      if [ "${VERSION_STATUS}" = "no_change" ] || [ "${VERSION_STATUS}" = "in_progress" ] || [ "${VERSION_STATUS}" = "mirror_empty" ]; then
        echo "VERSION_STATUS=${VERSION_STATUS}: skipping SIF update."
        exit 0
      fi
      echo "Starting SIF build from Docker Registry..."
      export SINGULARITY_DOCKER_USERNAME="${CI_REGISTRY_USER}"
      export SINGULARITY_DOCKER_PASSWORD="${CI_REGISTRY_PASSWORD}"
      
      # 定義 SIF 存放路徑
      DEST_DIR="/home/u1597171/clonezilla-ci/slurm"
      if [ ! -d "$DEST_DIR" ]; then
        echo "Warning: Global directory $DEST_DIR not found, using local project directory."
        DEST_DIR="$(pwd)/slurm"
        mkdir -p "$DEST_DIR"
      fi
      
      SIF_PATH="${DEST_DIR}/clonezilla-ci.sif"
      echo "Target SIF: ${SIF_PATH}"
      
      # 使用 -F 強制覆蓋舊檔，確保後續 Slurm 測試使用最新環境
      singularity build -F "${SIF_PATH}" docker://${CI_REGISTRY_IMAGE}:latest
      
      echo "Success: Updated SIF at ${SIF_PATH}"

.test_template:
  stage: test
  tags:
    - "$RUNNER_TAG"
  # Note: allow_failure: true was removed to work around a GitLab pipeline
  # status calculation bug where child pipelines with allow_failure jobs
  # are marked as "failed" even when all jobs succeed. Individual test
  # failures will now properly fail the pipeline; the version-gate early
  # exit (exit 0) ensures skipped tests don't cause failures.
  environment:
    name: "test/${ARCH}/${TYPE}"
  variables:
    LIBGUESTFS_DEBUG: "0"
    LIBGUESTFS_TRACE: "0"
    SLURM_PARTITION: "ct112"
    SLURM_ACCOUNT: "GOV109092"
  dependencies:
    - download_zip
  needs:
    - job: download_zip
    - job: build_singularity
      artifacts: false
  before_script:
    - |
      # Version gate: skip tests on scheduled no-change / in-progress runs.
      if [ "${VERSION_STATUS}" = "no_change" ] || [ "${VERSION_STATUS}" = "in_progress" ] || [ "${VERSION_STATUS}" = "mirror_empty" ]; then
        echo "VERSION_STATUS=${VERSION_STATUS}: skipping test (no new Clonezilla version to test)."
        exit 0
      fi
      # Display a prominent banner in the logs
      echo -e "\e[1;32m"
      echo "================================================================================"
      echo "  CLONEZILLA VERSION DETECTED: ${ZIP_FILE_FROM_BUILD}"
      echo "================================================================================"
      echo -e "\e[0m"

      # Create a version file artifact for visibility
      touch "version-${ZIP_FILE_FROM_BUILD}"

      # Dynamically locate the Singularity Image (SIF) for Slurm jobs
      export SIF_IMAGE=""
      POSSIBLE_SIFS=(
        "${CI_PROJECT_DIR}/slurm/clonezilla-ci.sif"
        "/home/u1597171/clonezilla-ci/slurm/clonezilla-ci.sif"
      )
      for p in "${POSSIBLE_SIFS[@]}"; do
        if [ -f "$p" ]; then
          export SIF_IMAGE="$p"
          echo "Found Singularity Image at: ${SIF_IMAGE}"
          break
        fi
      done

      # Auto-detect Environment Strategy
      if [ "$FORCE_LOCAL" = "true" ]; then
        echo "FORCE_LOCAL is true, setting TEST_ENV to local."
        export TEST_ENV="local"
      elif [ -z "$TEST_ENV" ]; then
        if command -v srun &> /dev/null && [ -f "${SIF_IMAGE}" ]; then
          echo "Detected Slurm environment (srun and SIF_IMAGE available). Setting TEST_ENV=slurm."
          export TEST_ENV="slurm"
        else
          echo "No Slurm environment detected. Using local shell execution."
          export TEST_ENV="local"
        fi
      elif [ "$TEST_ENV" = "slurm" ]; then
        # Validate that slurm is actually available on this runner
        if ! command -v srun &> /dev/null || [ ! -f "${SIF_IMAGE}" ]; then
          echo "WARNING: TEST_ENV=slurm requested but srun or SIF not available. Falling back to local."
          export TEST_ENV="local"
        fi
      fi

      if [ "$TEST_ENV" = "slurm" ]; then
        echo "Verifying Singularity image exists at ${SIF_IMAGE}..."
        if [ ! -f "${SIF_IMAGE}" ]; then
          echo "Error: Singularity image not found at ${SIF_IMAGE}!" >&2
          exit 1
        fi
        echo "Verifying build artifact (Clonezilla ZIP)..."
        if [ -z "${ZIP_FILE_FROM_BUILD}" ]; then
          echo "Error: ZIP_FILE_FROM_BUILD variable not passed from build job." >&2
          exit 1
        fi
        export ZIP_FILE_PATH="$(pwd)/${ZIP_DIR}/${ZIP_FILE_FROM_BUILD}"
        echo "Using ZIP file: ${ZIP_FILE_PATH}"
      else
        echo "Verifying build artifact (Clonezilla ZIP)..."
        if [ -z "${ZIP_FILE_FROM_BUILD}" ]; then
          echo "Error: ZIP_FILE_FROM_BUILD variable not passed from build job." >&2
          exit 1
        fi
        if ! [ -f "${ZIP_DIR}/${ZIP_FILE_FROM_BUILD}" ]; then
          echo "Error: Artifact zip file '${ZIP_DIR}/${ZIP_FILE_FROM_BUILD}' not found!" >&2
          echo "Listing contents of '${ZIP_DIR}/':"
          ls -l "${ZIP_DIR}/"
          exit 1
        fi
        echo "Using ZIP file from build job: ${ZIP_FILE_FROM_BUILD}"
        export ZIP_FILE="${ZIP_FILE_FROM_BUILD}"
      fi

      echo "Setting up qemu cloud images in the project root..."
      if [ -d "/data/cloudimages" ]; then
        echo "Available qcow imags in /data/cloudimages/:"
        find /data/cloudimages/ -name "*.qcow2"
        mkdir -p qemu/cloudimages
        ln -s /data/cloudimages/*.qcow2 qemu/cloudimages/
        echo "Linked cloud images from /data/cloudimages."
      elif [ -d "/home/u1597171/clonezilla-ci/qemu/cloudimages" ]; then
        echo "Available qcow imags in /home/u1597171/clonezilla-ci/qemu/cloudimages/:"
        find /home/u1597171/clonezilla-ci/qemu/cloudimages/ -name "*.qcow2"
        mkdir -p qemu/cloudimages
        ln -s /home/u1597171/clonezilla-ci/qemu/cloudimages/*.qcow2 qemu/cloudimages/
        echo "Linked cloud images from /home/u1597171/clonezilla-ci/qemu/cloudimages."
      else
        echo "Warning: /data/cloudimages not found. OS tests will fail if images are not present."
      fi

      echo "Available qcow imags in qemu/cloudimages/:"
      find qemu/cloudimages/ -name "*.qcow2"

      echo "Preparing log directory..."
      export LOG_DIR="./logs"
      mkdir -p $LOG_DIR

      echo "Setting up test data directory..."
      if [ -d "/data/dataSets" ]; then
        mkdir -p dev
        rm -rf dev/testData
        ln -s /data/dataSets dev/testData
        echo "Linked /data/dataSets to dev/testData."
      else
        echo "Warning: /data/dataSets not found on runner. Data clone/restore tests might fail."
      fi
  script:
    - |
      # Version gate: skip tests on scheduled no-change / in-progress runs.
      if [ "${VERSION_STATUS}" = "no_change" ] || [ "${VERSION_STATUS}" = "in_progress" ] || [ "${VERSION_STATUS}" = "mirror_empty" ]; then
        echo "VERSION_STATUS=${VERSION_STATUS}: skipping test (no new Clonezilla version to test)."
        exit 0
      fi

      if [ -z "$TEST_SCRIPT" ]; then
        echo "Error: TEST_SCRIPT is not set for this job!"
        exit 1
      fi

      rc=0
      if [ "$TEST_ENV" = "slurm" ]; then
        echo "Submitting Slurm job for ${TEST_SCRIPT}..."
        EVAL_TEST_SCRIPT=$(eval echo "$TEST_SCRIPT")
        EXTRA_BINDS=""
        [ -e "/dev/kvm" ] && EXTRA_BINDS="$EXTRA_BINDS --bind /dev/kvm:/dev/kvm"
        [ -d "/data/cloudimages" ] && EXTRA_BINDS="$EXTRA_BINDS --bind /data/cloudimages"
        [ -d "/data/dataSets" ] && EXTRA_BINDS="$EXTRA_BINDS --bind /data/dataSets"
        timeout -k 30 "${TEST_TIMEOUT_SECONDS}" \
        srun -p "${SLURM_PARTITION}" --account="${SLURM_ACCOUNT}" \
             --job-name="ci_$(basename ${EVAL_TEST_SCRIPT} .sh)" \
             --mem=8G --cpus-per-task=4 \
             singularity exec --bind .:/app ${EXTRA_BINDS} \
             "${SIF_IMAGE}" \
             bash -c "unset XDG_RUNTIME_DIR; cd /app/jobs && ./${EVAL_TEST_SCRIPT#jobs/} --zip ${ZIP_FILE_PATH} --arch ${ARCH} --no-ssh-forward" || rc=$?
      else
        echo "Running locally for ${TEST_SCRIPT}..."
        cd jobs
        EVAL_TEST_SCRIPT=$(eval echo "$TEST_SCRIPT")
        timeout -k 30 "${TEST_TIMEOUT_SECONDS}" \
        ./${EVAL_TEST_SCRIPT#jobs/} --zip "../${ZIP_DIR}/${ZIP_FILE_FROM_BUILD}" --arch "$ARCH" --no-ssh-forward || rc=$?
      fi
      if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
        echo "ERROR: ${TEST_SCRIPT} timed out after ${TEST_TIMEOUT_SECONDS}s (guest hang?). Failing fast so logs/results still upload." >&2
      fi
      exit "$rc"
  after_script:
    - |
      mkdir -p results
      job_started_ts=$(date -d "$CI_JOB_STARTED_AT" +%s)
      job_finished_ts=$(date -d "$CI_JOB_FINISHED_AT" +%s)
      duration=$((job_finished_ts - job_started_ts))
      duration_formatted=$(date -u -d "@${duration}" +'%H:%M:%S')

      echo "job_name: $CI_JOB_NAME" > "results/${CI_JOB_NAME}.yml"
      echo "job_status: $CI_JOB_STATUS" >> "results/${CI_JOB_NAME}.yml"
      echo "job_started_at: $CI_JOB_STARTED_AT" >> "results/${CI_JOB_NAME}.yml"
      echo "job_duration: $duration_formatted" >> "results/${CI_JOB_NAME}.yml"
      echo "arch: $ARCH" >> "results/${CI_JOB_NAME}.yml"
      echo "zip: $ZIP_FILE_FROM_BUILD" >> "results/${CI_JOB_NAME}.yml"
      echo "runner_description: $CI_RUNNER_DESCRIPTION" >> "results/${CI_JOB_NAME}.yml"
      if [ -n "$FS" ]; then
        echo "fs: $FS" >> "results/${CI_JOB_NAME}.yml"
      fi

  artifacts:
    when: always
    paths:
      - logs/
      - results/
      - "version-*"
    expire_in: 5 days
  # 4h = TEST_TIMEOUT_SECONDS (3h) + ~1h headroom for before_script
  # (zip download/extract, image prep) and artifact upload on failing jobs.
  timeout: 4h

