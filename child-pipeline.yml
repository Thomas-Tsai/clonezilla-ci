# Sends the end-of-run Telegram notification.
#
# Filter (enforced inside scripts/notify-telegram.sh, not via rules, so the
# job itself never blocks or fails the pipeline):
#   - scheduled + VERSION_STATUS=new_version  -> send summary (success or failure)
#   - scheduled + no_change / in_progress / mirror_empty -> skip
#   - manual (push / web / api / trigger)     -> always send summary
#
# needs mirrors publish_reports so this job (a) runs after every test job,
# (b) receives the results/*.yml artifacts for the summary, and (c) receives
# the check_version / download_zip dotenvs (VERSION_STATUS, ZIP_FILE_FROM_BUILD).
# Requires the masked CI/CD variables TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID;
# without them the job logs a warning and exits 0. The job itself never fails.
notify:telegram:
  stage: deploy
  tags:
    - "$RUNNER_TAG"
  rules:
    - when: always
  needs:
    - job: check_version
      optional: true
      artifacts: true
    - job: download_zip
      artifacts: true
    - test:os:ubuntu
    - test:os:debian
    - job: test:os:windows11
      optional: true
    - test:fs:exfat
    - test:fs:ntfs
    - test:fs:vfat
    - test:fs:ext4
    - test:fs:xfs
    - test:fs:btrfs
    - job: test:slurm:sample
      optional: true
    - test:lite_bt_from_device
    - test:lite_bt_from_image
    - test:lite_multicast_from_image
    - test:lite_multicast_from_device
    - test:lite_raw_data
    - test:disk_512en_4kn_ext4_data
    - test:dev_to_dev
  script:
    - chmod +x scripts/notify-telegram.sh
    - ./scripts/notify-telegram.sh finished

# Publishes test reports to the 'test-reports' branch.
#
# WARNING: Do NOT rename this job to 'pages'. GitLab only deploys Pages from a
# job named 'pages' (or with 'pages: true'), and the internal pages:deploy step
# inside child pipelines has pipeline-status side effects (see a98b086b).
# Note: pushes made with CI_JOB_TOKEN do NOT trigger a pipeline on the
# test-reports branch, so publish_reports.sh additionally triggers the pages
# pipeline via the pipeline trigger API. The test-reports branch's own
# .gitlab-ci.yml 'pages' job then deploys https://clonezilla-ci-036aa1.gitlab.io/ .
publish_reports:
  stage: deploy
  tags:
    - "$RUNNER_TAG"
  needs:
    - job: check_version
      optional: true
      artifacts: true
    # Also pull the download_zip dotenv so ZIP_FILE_FROM_BUILD is available
    # here as a fallback zip name when no test result files exist at all.
    - job: download_zip
      artifacts: true
    - test:os:ubuntu
    - test:os:debian
    - job: test:os:windows11
      optional: true
    - test:fs:exfat
    - test:fs:ntfs
    - test:fs:vfat
    - test:fs:ext4
    - test:fs:xfs
    - test:fs:btrfs
    - job: test:slurm:sample
      optional: true
    - test:lite_bt_from_device
    - test:lite_bt_from_image
    - test:lite_multicast_from_image
    - test:lite_multicast_from_device
    - test:lite_raw_data
    - test:disk_512en_4kn_ext4_data
    - test:dev_to_dev
  script:
    - |
      # Version gate: skip report publishing on scheduled no-change / in-progress runs.
      if [ "${VERSION_STATUS}" = "no_change" ] || [ "${VERSION_STATUS}" = "in_progress" ] || [ "${VERSION_STATUS}" = "mirror_empty" ]; then
        echo "VERSION_STATUS=${VERSION_STATUS}: skipping pages (no tests ran)."
        # Create an empty public/ dir so the artifacts upload step succeeds
        # (GitLab marks the pipeline as failed if artifacts.paths has no
        # matching files, even when the job script itself exits 0).
        mkdir -p public
        exit 0
      fi
      # Build the expected-test-job list per ARCH for publish_reports.sh's
      # missing-artifact synthesis. Jobs that legitimately never exist for an
      # arch MUST NOT be included (e.g. test:os:windows11 is ruled out for
      # arm64/riscv64; adding it would falsely mark the report failed).
      EXPECTED_TEST_JOBS="test:os:ubuntu test:os:debian test:fs:exfat test:fs:ntfs test:fs:vfat test:fs:ext4 test:fs:xfs test:fs:btrfs test:slurm:sample test:lite_bt_from_device test:lite_bt_from_image test:lite_multicast_from_image test:lite_multicast_from_device test:lite_raw_data test:disk_512en_4kn_ext4_data test:dev_to_dev"
      if [ "$ARCH" = "amd64" ]; then
        EXPECTED_TEST_JOBS="$EXPECTED_TEST_JOBS test:os:windows11"
      fi
      export EXPECTED_TEST_JOBS
      chmod +x jobs/publish_reports.sh
      jobs/publish_reports.sh
  artifacts:
    paths:
      - public
    expire_in: 30 days
  # when: always is required — publishing must also happen when some test
  # jobs FAILED. The report then records status=failed in reports.json,
  # which both publishes the failure to Pages and stops the version-gate
  # retry loop (a failed version used to leave no report behind, so the
  # next schedule retested the same broken version every ~12h and spammed
  # failure notification mails).
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: always
    - if: '$CI_COMMIT_BRANCH == "test-reports"'
      when: always
